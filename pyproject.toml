[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meok-omnibus-tracker-mcp"
version = "1.1.5"
requires-python = ">=3.10"
description = "EU Digital Omnibus AI Act tracker - Track delay status by article. First-mover advantage for SEO + brand."
keywords = ["mcp", "model-context-protocol", "mcp-server", "claude", "anthropic", "agent", "meok", "meok-ai-labs", "ai", "eu-ai-act", "digital-omnibus", "compliance"]
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "MEOK AI Labs", email = "hello@meok.ai"}]
urls = {Homepage = "https://csoai.org", Repository = "https://github.com/CSOAI-ORG/meok-omnibus-tracker-mcp"}
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["mcp>=1.0.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "black>=22.0"]

[project.scripts]
meok-omnibus-tracker-mcp = "server:main"

[tool.hatch.build.targets.wheel]
packages = ["."]
only-include = ["server.py"]
