[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meok-omnibus-tracker-mcp"
version = "1.0.2"
description = "EU AI Act Digital Omnibus tracker MCP. Live source of truth for the EU AI Act delays following Parliament's 569-45 vote on 23 March 2026 — high-risk Annex III now 2 Dec 2027, Annex I now 2 Aug 2028, watermarking (Art 50) now 2 Nov 2026 (the new nearest cliff), Article 5 prohibitions + GPAI obligations + penalty regime UNCHANGED. Per-provision queryable status. Free tier — pure lead capture for Pro signed status attestations. By MEOK AI Labs."
license = {file = "LICENSE"}
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "MEOK AI Labs", email = "nicholas@meok.ai"}]
keywords = ["mcp", "eu-ai-act", "digital-omnibus", "regulation-2024-1689", "compliance-deadlines", "watermarking", "high-risk-ai", "annex-iii", "gpai", "trilogue", "signed-attestation", "meok-ai-labs"]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License", "Operating System :: OS Independent", "Topic :: Office/Business"]
dependencies = ["mcp>=1.0.0"]

[project.urls]
Homepage = "https://meok.ai/meok-omnibus-tracker-mcp"
Repository = "https://github.com/CSOAI-ORG/meok-omnibus-tracker-mcp"

[tool.hatch.build.targets.wheel]
packages = ["."]
only-include = ["server.py"]

[project.scripts]
meok-omnibus-tracker-mcp = "server:main"

[tool.mcp]
mcpName = "io.github.CSOAI-ORG/meok-omnibus-tracker-mcp"
